name: ci

on:
  pull_request:
  push:
    branches: [develop, main, 'feat/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx nest build

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/music-room-server:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/music-room-server:latest

  # Roll the new image out to the k3s node, set up by hand once (deploy/k3s/README.md).
  # Only swaps the API image; manifests, secrets and Postgres stay as configured on the node.
  # Skipped until the K3S_HOST variable is set.
  deploy-k3s:
    if: startsWith(github.ref, 'refs/tags/v') && vars.K3S_HOST != ''
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET: ${{ vars.K3S_USER }}@${{ vars.K3S_HOST }}
      PORT: ${{ vars.K3S_SSH_PORT || '22' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/music-room-server:${{ github.ref_name }}
    steps:
      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.K3S_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.K3S_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        run: |
          ssh -p "$PORT" "$TARGET" "kubectl -n music-room set image deploy/api api=$IMAGE &&
            kubectl -n music-room rollout status deploy/api --timeout=10m"
      - name: Status
        if: always()
        run: |
          ssh -p "$PORT" "$TARGET" 'kubectl -n music-room get pods; kubectl -n music-room logs deploy/api --tail=30' || true
          rm -f ~/.ssh/id_ed25519
